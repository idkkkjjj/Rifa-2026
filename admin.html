<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Rifa do Terceirão</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--azul:#040b5c;--azul-2:#0a1470;--creme:#fdf1c4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--azul);color:var(--creme);font-family:Montserrat,system-ui,sans-serif;padding:20px 12px 40px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{margin:0 0 16px;font-size:13px;opacity:.8}
  input,button{font:inherit}
  input{width:100%;padding:12px;border-radius:8px;border:2px solid var(--creme);background:#030733;color:var(--creme);margin-bottom:10px}
  .btn{background:var(--creme);color:var(--azul);border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}
  .btn.sec{background:transparent;color:var(--creme);border:2px solid var(--creme)}
  .btn:focus-visible,input:focus-visible,.n:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #login{max-width:360px;margin:60px auto}
  #app{display:none}
  .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .stats div{background:#030733;border-radius:8px;padding:8px;text-align:center;font-size:11px}
  .stats b{display:block;font-size:18px}
  #grade{display:grid;grid-template-columns:repeat(10,1fr);gap:7px 5px}
  .n{aspect-ratio:2.1/1;border-radius:50%;border:2.5px solid #000;background:var(--azul);color:var(--creme);
     font-weight:800;font-size:clamp(9px,2.7vw,13px);cursor:pointer;padding:0;display:grid;place-content:center;position:relative}
  .n.reservado{background:repeating-linear-gradient(45deg,#2b3390 0 3px,var(--azul) 3px 7px);border-color:var(--creme)}
  .n.pago{background:var(--creme);color:var(--azul)}
  .n.tem-nome::after{content:"";position:absolute;right:3px;top:2px;width:5px;height:5px;border-radius:50%;background:#ff8a5c}
  dialog{border:0;border-radius:14px;background:var(--creme);color:var(--azul);padding:20px;width:min(92vw,360px)}
  dialog::backdrop{background:rgba(0,0,20,.7)}
  dialog h2{margin:0 0 12px;font-size:20px}
  dialog input{background:#fff;color:var(--azul);border-color:var(--azul)}
  .opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .opcoes button{padding:10px 4px;border-radius:8px;border:2px solid var(--azul);background:transparent;color:var(--azul);font-weight:700;cursor:pointer}
  .opcoes button[aria-pressed="true"]{background:var(--azul);color:var(--creme)}
  .acoes{display:flex;gap:8px}
  .acoes .btn{flex:1}
  dialog .btn.sec{color:var(--azul);border-color:var(--azul)}
  #msg{font-size:13px;min-height:18px;color:#ffb4a2}
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Entrar</h1>
    <p class="sub">Área restrita da rifa.</p>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn" id="entrar" style="width:100%">Entrar</button>
    <p id="msg"></p>
  </section>

  <section id="app">
    <div class="topo">
      <div><h1>Rifa do Terceirão</h1><p class="sub" style="margin:0">Toque num número para alterar.</p></div>
      <button class="btn sec" id="sair">Sair</button>
    </div>
    <div class="stats">
      <div><b id="s-livre">0</b>livres</div>
      <div><b id="s-res">0</b>reservados</div>
      <div><b id="s-pago">0</b>pagos</div>
      <div><b id="s-grana">R$0</b>arrecadado</div>
    </div>
    <div id="grade"></div>
  </section>
</main>

<dialog id="dlg">
  <h2 id="dlg-titulo">Número</h2>
  <div class="opcoes" id="opcoes">
    <button data-s="livre">Livre</button>
    <button data-s="reservado">Reservado</button>
    <button data-s="pago">Pago</button>
  </div>
  <input id="nome" type="text" placeholder="Nome de quem comprou (opcional)">
  <div class="acoes">
    <button class="btn sec" id="cancelar">Cancelar</button>
    <button class="btn" id="salvar">Salvar</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const C = window.RIFA, $ = id => document.getElementById(id);
  const db = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  let estado = {}, nomes = {}, atual = null, statusSel = "livre";

  const grade = $("grade"), celulas = {};
  for (let i = 1; i <= C.TOTAL; i++){
    const b = document.createElement("button");
    b.className = "n"; b.textContent = i; b.onclick = () => abrir(i);
    grade.appendChild(b); celulas[i] = b;
  }

  async function entrarApp(){
    $("login").style.display = "none"; $("app").style.display = "block";
    await carregar();
    db.channel("rifa-admin").on("postgres_changes",{event:"*",schema:"public",table:"rifa"},carregar).subscribe();
  }

  async function carregar(){
    const [a, b] = await Promise.all([
      db.from("rifa").select("numero,status"),
      db.from("rifa_nomes").select("numero,nome")
    ]);
    if (a.error || b.error){ alert("Erro ao carregar: " + (a.error||b.error).message); return; }
    estado = {}; nomes = {};
    a.data.forEach(r => estado[r.numero] = r.status);
    b.data.forEach(r => { if (r.nome) nomes[r.numero] = r.nome; });
    pintar();
  }

  function pintar(){
    let l=0,r=0,p=0;
    for (let i=1;i<=C.TOTAL;i++){
      const s = estado[i] || "livre";
      celulas[i].className = "n " + s + (nomes[i] ? " tem-nome" : "");
      celulas[i].title = nomes[i] || "";
      if (s==="livre") l++; else if (s==="reservado") r++; else p++;
    }
    $("s-livre").textContent=l; $("s-res").textContent=r; $("s-pago").textContent=p;
    $("s-grana").textContent = "R$" + (p*C.PRECO);
  }

  function marcar(s){
    statusSel = s;
    document.querySelectorAll("#opcoes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s===s));
  }
  document.querySelectorAll("#opcoes button").forEach(b => b.onclick = () => marcar(b.dataset.s));

  function abrir(n){
    atual = n;
    $("dlg-titulo").textContent = "Número " + n;
    $("nome").value = nomes[n] || "";
    marcar(estado[n] || "livre");
    $("dlg").showModal();
  }
  $("cancelar").onclick = () => $("dlg").close();

  $("salvar").onclick = async () => {
    const n = atual, nome = $("nome").value.trim();
    $("salvar").disabled = true;
    const u = await db.from("rifa").update({status: statusSel, updated_at: new Date().toISOString()}).eq("numero", n);
    let e2 = null;
    if (!u.error){
      if (statusSel === "livre" || !nome) e2 = (await db.from("rifa_nomes").delete().eq("numero", n)).error;
      else e2 = (await db.from("rifa_nomes").upsert({numero:n, nome})).error;
    }
    $("salvar").disabled = false;
    if (u.error || e2){ alert("Não salvou: " + (u.error||e2).message); return; }
    estado[n] = statusSel;
    if (statusSel !== "livre" && nome) nomes[n] = nome; else delete nomes[n];
    pintar(); $("dlg").close();
  };

  $("entrar").onclick = async () => {
    $("msg").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
    if (error) $("msg").textContent = "E-mail ou senha incorretos.";
    else entrarApp();
  };
  $("senha").addEventListener("keydown", e => { if (e.key==="Enter") $("entrar").click(); });
  $("sair").onclick = async () => { await db.auth.signOut(); location.reload(); };

  db.auth.getSession().then(({data}) => { if (data.session) entrarApp(); });
})();
</script>
</body>
</html>
